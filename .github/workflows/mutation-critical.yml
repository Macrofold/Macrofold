name: Extended critical mutation tests
on:
  schedule:
    - cron: '19 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mutation-critical-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLATFORM_MODE: local
      EXECUTION_PROVIDER: simulator
      ALLOW_PAID_EXECUTION: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup
      - run: pnpm test:mutation:critical
      - name: Mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: critical-mutation-evidence
          path: reports/mutation-critical/
          retention-days: 7
      - name: Stop fixture infrastructure
        if: always()
        run: docker compose -f infra/compose.yml down -v
