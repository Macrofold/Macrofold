name: Verify without paid providers
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLATFORM_MODE: local
      EXECUTION_PROVIDER: simulator
      ALLOW_PAID_EXECUTION: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run setup
      - run: pnpm check && pnpm build
      - name: Domain, contract and package acceptance
        run: |
          pnpm test:coverage
          pnpm test:load
          pnpm exec tsx scripts/test-install.ts
          pnpm test:packages
          python -m pip install './sdk/python' pytest
          python -m pytest sdk/python/tests
          python tests/test_costs.py
          python scripts/check-docs.py
          pnpm contracts
          git diff --exit-code -- packages/contracts/api.d.ts sdk/typescript/src/schema.d.ts sdk/typescript/src/routes.ts sdk/python/hosted_agents/routes.json
          pnpm audit --audit-level high
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: typescript-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish public repository coverage
        if: success() && vars.CODECOV_ENABLED == 'true' && github.event.repository.private == false
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          files: coverage/lcov.info
          flags: typescript
          disable_search: true
          fail_ci_if_error: true
          # Enable tokenless public uploads in Codecov; no repository secrets
          # or write-capable GitHub tokens are made available to fork tests.
      - name: Dashboard and streaming CLI acceptance
        run: |
          pnpm start > /tmp/platform-web.log 2>&1 &
          pnpm worker > /tmp/platform-worker.log 2>&1 &
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3210/health >/dev/null; then break; fi
            sleep 1
          done
          pnpm test:e2e
          pnpm test:cli
          python scripts/test-terminal.py
          python scripts/test-python-live.py
      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-evidence
          path: test-results
          retention-days: 7
      - name: Stop fixture infrastructure
        if: always()
        run: docker compose -f infra/compose.yml down -v
  native:
    name: Native runtime image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLATFORM_MODE: local
      EXECUTION_PROVIDER: simulator
      ALLOW_PAID_EXECUTION: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.0
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Build the current source and exercise actual harnesses without external networking
        run: |
          docker build -f infra/runtime.Dockerfile -t platform-runtime:0.1.0 .
          pnpm test:native --image-only
          pnpm test:native opencode --questions --image-only
          docker run --rm --network none --mount type=bind,src="$PWD/tests/fixtures",dst=/tests,readonly platform-runtime:0.1.0 node /tests/stdio-native.mjs
  mutation:
    name: Runtime capability mutation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.0
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:mutation
      - name: Mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-capability-mutations
          path: reports/mutation/
          if-no-files-found: warn
          retention-days: 7
