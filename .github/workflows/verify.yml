name: Verify without paid providers
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sdks:
    name: Generated SDK contracts and transports
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLATFORM_MODE: local
      EXECUTION_PROVIDER: simulator
      ALLOW_PAID_EXECUTION: 'false'
      RUSTUP_TOOLCHAIN: '1.94.1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: sdk/go/go.sum
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install './sdk/python[test]'
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm sdk:generate:all
      - name: Check generation drift
        run: git diff --exit-code -- packages/contracts sdk docs/features/api/sdks/reference.md
      - run: rustup toolchain install 1.94.1 --profile minimal
      - run: pnpm run setup
      - run: pnpm test:sdks
      - name: Stop SDK fixture infrastructure
        if: always()
        run: docker compose -f infra/compose.yml down -v
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLATFORM_MODE: local
      EXECUTION_PROVIDER: simulator
      ALLOW_PAID_EXECUTION: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run setup
      - run: pnpm docs:check && pnpm check && pnpm build
      - name: Domain, contract and package acceptance
        run: |
          python -m pip install './sdk/python' pytest 'coverage==7.13.5'
          pnpm test:coverage:all
          pnpm test:load
          pnpm exec tsx scripts/test-install.ts
          pnpm test:packages
          mkdir -p coverage/python
          COVERAGE_FILE=coverage/python/.coverage PYTHONPATH=sdk/python python -m coverage run -m pytest sdk/python/tests tests/test_costs.py
          COVERAGE_FILE=coverage/python/.coverage python -m coverage report
          COVERAGE_FILE=coverage/python/.coverage python -m coverage xml
          COVERAGE_FILE=coverage/python/.coverage python -m coverage json -o coverage/python/coverage.json
          pnpm docs:check
          pnpm contracts
          git diff --exit-code -- packages/contracts/api.d.ts sdk/typescript/src/schema.d.ts sdk/typescript/src/routes.ts sdk/typescript/src/resources.ts sdk/python/macrofold/routes.json docs/features/api/sdks/reference.md
          pnpm audit --audit-level high
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typescript-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 7
      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-evidence
          path: test-results
          retention-days: 7
      - name: Stop fixture infrastructure
        if: always()
        run: docker compose -f infra/compose.yml down -v
  native:
    name: Native runtime image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLATFORM_MODE: local
      EXECUTION_PROVIDER: simulator
      ALLOW_PAID_EXECUTION: 'false'
      NATIVE_COVERAGE_DIR: coverage/native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.0
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Build the current source and exercise actual harnesses without external networking
        run: |
          docker build -f infra/runtime.Dockerfile -t platform-runtime:0.1.0 .
          pnpm test:native --image-only
          pnpm test:native opencode --questions --image-only
          pnpm test:native --stdio --image-only
      - name: Complete API-triggered Docker journeys with scripted providers
        run: |
          docker compose -f infra/compose.yml up -d --wait
          pnpm test:journey:docker
      - name: Stop journey fixture infrastructure
        if: always()
        run: docker compose -f infra/compose.yml down -v
      - name: Native coverage observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-coverage
          path: coverage/native/
          if-no-files-found: error
          retention-days: 7
  mutation:
    name: Critical policy mutation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.0
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:mutation
      - name: Mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-capability-mutations
          path: reports/mutation/
          if-no-files-found: warn
          retention-days: 7
  coverage:
    name: Combined coverage gates
    needs: [acceptance, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.0
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: typescript-coverage
          path: coverage/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-coverage
          path: coverage/full/native/
      - run: pnpm coverage:merge
        env:
          COVERAGE_REQUIRED_SURFACES: browser,server,worker,cli,native
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: combined-coverage
          path: |
            coverage/full/merged/
            coverage/python/
          retention-days: 7
      - name: Publish public TypeScript coverage
        if: vars.CODECOV_ENABLED == 'true' && github.event.repository.private == false
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          files: coverage/full/merged/lcov.info
          flags: typescript
          disable_search: true
          fail_ci_if_error: true
      - name: Publish separate Python coverage
        if: vars.CODECOV_ENABLED == 'true' && github.event.repository.private == false
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          files: coverage/python/coverage.xml
          flags: python
          disable_search: true
          fail_ci_if_error: true
