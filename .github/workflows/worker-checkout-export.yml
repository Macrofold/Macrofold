name: Worker checkout export
on:
  push:
    branches: [feat/worker-economics-autoscaling]
    paths: [.github/workflows/worker-checkout-export.yml]
permissions:
  contents: read
jobs:
  export:
    if: github.repository == 'Macrofold/Macrofold'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Export tracked source changes only
        run: |
          mkdir -p /tmp/worker-checkout
          git diff --binary 2bfedf54644212277e0940a6d4b3694cab60c556 HEAD > /tmp/worker-checkout/source.patch
          git rev-parse HEAD > /tmp/worker-checkout/commit.txt
          git ls-files -s > /tmp/worker-checkout/manifest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-checkout
          path: /tmp/worker-checkout/
          retention-days: 3
