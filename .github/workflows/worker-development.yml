name: Worker branch verification
on:
  push:
    branches: [feat/worker-economics-autoscaling]
    paths:
      - .github/workflows/worker-development.yml
      - scripts/workers/resume-edit.py
      - scripts/workers/verify.marker
permissions:
  contents: read
concurrency:
  group: worker-development-${{ github.ref }}
  cancel-in-progress: false
jobs:
  implementation:
    if: github.repository == 'Macrofold/Macrofold' && github.ref == 'refs/heads/feat/worker-economics-autoscaling'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PLATFORM_MODE: local
      EXECUTION_PROVIDER: simulator
      ALLOW_PAID_EXECUTION: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile --reporter=append-only
      - name: Apply reviewed source change
        run: |
          if test -f scripts/workers/resume-edit.py; then
            python3 scripts/workers/resume-edit.py
            rm scripts/workers/resume-edit.py
          fi
          git diff --exit-code -- .github/workflows
      - name: Regenerate owned contracts and public documentation
        run: |
          pnpm sdk:generate:all
          pnpm docs:generate
      - name: Publish reviewed changes to the unmerged feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add --all
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Apply Worker cutover and regenerate owned contracts'
            git -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/feat/worker-economics-autoscaling
          fi
          echo "VERIFIED_SOURCE_COMMIT=$(git rev-parse HEAD)"
      - name: Compile application and runtime
        run: |
          pnpm check
          pnpm build:runtime
      - name: Execute bounded runtime stress workload
        if: hashFiles('scripts/workers/stress.ts') != ''
        run: |
          pnpm run setup
          pnpm exec tsx scripts/workers/stress.ts
      - name: Check documentation integrity
        if: always()
        run: pnpm docs:check
      - name: Preserve execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-runtime-evidence
          path: /tmp/worker-stress.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Release disposable infrastructure
        if: always()
        run: docker compose -f infra/compose.yml down -v
