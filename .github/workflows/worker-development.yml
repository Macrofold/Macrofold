name: Worker branch verification
on:
  push:
    branches: [feat/worker-economics-autoscaling]
permissions:
  contents: read
concurrency:
  group: worker-development-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'Macrofold/Macrofold' && github.ref == 'refs/heads/feat/worker-economics-autoscaling'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Export tracked source without credentials or runtime data
        run: |
          mkdir -p /tmp/worker-source
          git archive --format=tar.gz HEAD -o /tmp/worker-source/source.tar.gz
          git rev-parse HEAD > /tmp/worker-source/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-source
          path: /tmp/worker-source/
          retention-days: 1
  implementation:
    if: github.repository == 'Macrofold/Macrofold' && github.ref == 'refs/heads/feat/worker-economics-autoscaling'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PLATFORM_MODE: local
      EXECUTION_PROVIDER: simulator
      ALLOW_PAID_EXECUTION: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Apply reviewed development edit when supplied
        run: |
          if test -f scripts/workers/development-edit.py; then
            python3 scripts/workers/development-edit.py
            rm scripts/workers/development-edit.py
          fi
      - name: Regenerate public contracts and documentation
        run: |
          pnpm sdk:generate:all
          pnpm docs:generate
      - name: Publish generated changes to this feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add --all
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Apply reviewed Worker changes and regenerate owned contracts'
            git -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/feat/worker-economics-autoscaling
          fi
          echo "VERIFIED_SOURCE_COMMIT=$(git rev-parse HEAD)"
      - run: pnpm check
      - run: pnpm run setup
      - name: Unit and database integration acceptance
        run: pnpm test:domain tests/unit tests/integration tests/git.test.ts tests/git-sync.test.ts
      - run: pnpm docs:check
      - name: Failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-development-evidence
          path: |
            coverage/
            test-results/
          if-no-files-found: ignore
          retention-days: 3
      - name: Stop disposable fixture infrastructure
        if: always()
        run: docker compose -f infra/compose.yml down -v
