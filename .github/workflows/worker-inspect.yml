name: Worker source inspection
on:
  push:
    branches: [feat/worker-economics-autoscaling]
    paths: [.github/workflows/worker-inspect.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          show-progress: false
      - name: Compact native failure evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,urllib.request,json
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          url='https://api.github.com/repos/Macrofold/Macrofold/actions/jobs/107488171462/logs'
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r:
              lines=r.read().decode().splitlines()
          print('NATIVE_LOG_LAST_LINES\n'+'\n'.join(lines[-100:]))
          PY
      - name: Source integration inventory
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,json
          paths=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          for p in paths:
              if not p.startswith(('packages/','apps/web/','scripts/','docs/api/','tests/')) or not p.endswith(('.ts','.tsx','.sql','.json','.mjs')):continue
              if p.endswith('api.d.ts') or p.startswith(('apps/web/public/','docs/api/openapi')):continue
              s=pathlib.Path(p).read_text()
              if any(term in s for term in ['sandbox_id','createSandbox','getSandbox','keep_warm_seconds','active_run_id','SandboxMachines']):
                  print('CUTOVER_FILE',p)
                  for i,line in enumerate(s.splitlines()):
                      if any(term in line for term in ['sandbox_id','createSandbox','keep_warm_seconds','SandboxMachines']):print(str(i+1)+': '+line[:250])
          for p in ['infra/runtime.Dockerfile','infra/runtime/package.json','packages/cli/src/index.ts']:
              print('SOURCE_BEGIN',p,'\n'+pathlib.Path(p).read_text(),'SOURCE_END')
          PY
