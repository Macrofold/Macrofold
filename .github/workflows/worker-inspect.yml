name: Worker source inspection
on:
  push:
    branches: [feat/worker-economics-autoscaling]
    paths: [.github/workflows/worker-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          show-progress: false
      - name: Inventory source contracts and ownership
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,json
          paths=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          print('SCOPED_RULES', '\n'.join(p for p in paths if p.endswith('AGENTS.md')))
          print('COMPUTE_FILES','\n'.join(p for p in paths if any(x in p for x in ['worker','host-','sandbox']) and not p.startswith(('sdk/','apps/web/public/','docs/product/'))))
          print('SCHEMA_FILES','\n'.join(p for p in paths if p.startswith('packages/db/') and p.endswith('.sql')))
          for p in paths:
              if not p.startswith(('packages/','scripts/','apps/web/')) or not p.endswith(('.ts','.tsx','.mjs')):continue
              if p.endswith(('api.d.ts','schema.d.ts')) or '/public/' in p:continue
              s=pathlib.Path(p).read_text()
              terms=['sandbox_id','createSandbox','getSandbox','keep_warm_seconds','active_run_id','SandboxMachines']
              hits=[(i+1,line.strip()) for i,line in enumerate(s.splitlines()) if any(term in line for term in terms)]
              if hits:
                  print('CUTOVER',p)
                  for i,line in hits: print(f'{i}: {line[:260]}')
          s=json.loads(pathlib.Path('docs/api/openapi.json').read_text())
          for name in ['Worker','WorkerCreate','WorkerPatch','WorkerAction','WorkerOffering','WorkerOfferingList','RunCreate','NativeRunCreate','MessageCreate','RunAccepted']:
              print('SCHEMA',name,json.dumps(s['components']['schemas'].get(name)))
          print('MCP_WORKER_OPERATIONS',[(p,list(v)) for p,v in s['paths'].items() if 'workers' in p or 'worker-offerings' in p])
          PY
