name: Worker source inspection
on:
  push:
    branches: [feat/worker-economics-autoscaling]
    paths: [.github/workflows/worker-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          show-progress: false
      - name: Inventory remaining architecture references
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,re,json
          paths=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          for name in paths:
              p=pathlib.Path(name)
              if p.suffix not in ('.ts','.tsx','.mjs','.md','.json','.yml'):continue
              if name.startswith(('sdk/','apps/web/public/','node_modules/')) or p.name in ('openapi.json','api.d.ts','schema.d.ts'):continue
              text=p.read_text()
              if p.suffix=='.md':
                  terms=['sandbox','Sandbox','not yet implemented','not yet enabled','Target API','reusable compute']
              else: terms=['sandbox-control','sandbox_id','SandboxBinding','SandboxControl','SandboxTools','RENDER_SANDBOX','test:sandboxes','--sandboxes','machineTools(','machines()','SandboxRow']
              matches=[(i+1,line) for i,line in enumerate(text.splitlines()) if any(term in line for term in terms)]
              if matches:
                  print('FILE',name)
                  for number,line in matches:print(number,line[:350])
          print('WORKFLOWS',','.join(p for p in paths if p.startswith('.github/workflows/worker')))
          print('ROOT_SCRIPTS',json.dumps(json.loads(pathlib.Path('package.json').read_text())['scripts']))
          PY
