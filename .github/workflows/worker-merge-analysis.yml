name: Worker merge analysis
on:
  push:
    branches: [feat/worker-economics-autoscaling]
    paths: [.github/workflows/worker-merge-analysis.yml]
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reproduce merge against main
        run: |
          git config user.name "merge-analysis"
          git config user.email "merge-analysis@example.invalid"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          code=$?
          set -e
          mkdir -p /tmp/merge-conflicts
          git diff --name-only --diff-filter=U | while IFS= read -r path; do
            mkdir -p "/tmp/merge-conflicts/$(dirname "$path")"
            cp "$path" "/tmp/merge-conflicts/$path" 2>/dev/null || true
          done
          git diff --cc > /tmp/merge-conflicts/conflicts.diff || true
          git diff --name-only --diff-filter=U > /tmp/merge-conflicts/conflicts.txt || true
          echo "MERGE_EXIT=$code"
          cat /tmp/merge-conflicts/conflicts.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-merge-conflicts
          path: /tmp/merge-conflicts/
          retention-days: 7
