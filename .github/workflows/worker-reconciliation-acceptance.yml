name: Worker reconciliation acceptance
on:
  push:
    branches: [integration/worker-reconciliation-checks]
    paths: [.github/workflows/worker-reconciliation-acceptance.yml]
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLATFORM_MODE: local
      EXECUTION_PROVIDER: simulator
      ALLOW_PAID_EXECUTION: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup
      - name: Apply narrowly scoped existing-fixture corrections for verification
        run: |
          mkdir -p /tmp/reconciliation-acceptance
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          def edit(path, before, after):
              p=Path(path); text=p.read_text()
              if text.count(before)!=1: raise RuntimeError('Unexpected source: '+path)
              p.write_text(text.replace(before,after,1))
          p='tests/integration/tool-broker.test.ts'
          edit(p,"import { seal } from '../../packages/core/src/crypto';","import { seal } from '../../packages/core/src/crypto';\nimport { credit } from '../../packages/core/src/ledger';")
          edit(p,"  account = await fixtureAccount('Broker fixtures');","  account = await fixtureAccount('Broker fixtures');\n  // A simulated admission holds no credit; priced platform tools still require funding.\n  await transaction(account.p.organizationId, tx =>\n    credit(tx, account.p.organizationId, 10000000n, `broker-fixture:${account.p.organizationId}`));")
          p='tests/integration/inference.test.ts'
          edit(p,"  expect(observations.find(o=>o.name==='decision.response')).toMatchObject({type:'event',output:{content:expect.any(Array)},context:{run_id:runId}});","  // Successful output belongs to the settled generation, not a duplicate raw-response event.\n  expect(observations.filter(o=>o.type==='generation')).toHaveLength(1);")
          edit(p,"    const queued = await client.request('createInference', { body: input() });","    const queued = await client.request('createInference', { body: input(), headers: { Prefer: 'respond-async' } });")
          edit('tests/unit/decision-protocols.test.ts',"      'explicitly supported decision model',","      expect.objectContaining({ status: 400, code: 'decision_model_unavailable' }),")
          result={}
          for name in ['tests/integration/tool-broker.test.ts','tests/integration/inference.test.ts','tests/unit/decision-protocols.test.ts']:
              p=Path(name); data=p.read_bytes(); result[name]=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              shutil.copyfile(p,'/tmp/reconciliation-acceptance/'+p.name)
          Path('/tmp/reconciliation-acceptance/fixture-hashes.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - name: Execute the complete existing domain suite
        id: domain
        continue-on-error: true
        run: pnpm test:domain 2>&1 | tee /tmp/reconciliation-acceptance/domain.log
      - name: Isolate scheduler-sensitive fixtures without changing production scheduling
        if: steps.domain.outcome == 'failure'
        run: |
          failed=0
          for name in agent-permissions decision-scheduling deletion growth-activation media scale scheduling webhooks; do
            pnpm test:domain "tests/integration/$name.test.ts" > "/tmp/reconciliation-acceptance/isolated-$name.log" 2>&1 || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: worker-reconciliation-acceptance
          path: /tmp/reconciliation-acceptance/
          retention-days: 7
      - name: Preserve full-suite failure status
        if: steps.domain.outcome == 'failure'
        run: exit 1
      - name: Clean disposable infrastructure
        if: always()
        run: docker compose -f infra/compose.yml down -v
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PLATFORM_MODE: local
      EXECUTION_PROVIDER: simulator
      ALLOW_PAID_EXECUTION: 'false'
      NATIVE_COVERAGE_DIR: coverage/native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Execute image-based native acceptance with source-complete coverage
        run: |
          mkdir -p /tmp/reconciled-native
          docker build -f infra/runtime.Dockerfile -t platform-runtime:0.1.0 . > /tmp/reconciled-native/build.log 2>&1 || { tail -100 /tmp/reconciled-native/build.log; exit 1; }
          { pnpm test:native --image-only &&
            pnpm test:native codex claude-code --media --image-only &&
            pnpm test:native --permissions --image-only &&
            pnpm test:native opencode --questions --image-only &&
            pnpm test:native hermes deepseek pi --tools --image-only &&
            pnpm test:native hermes deepseek pi --failure --image-only &&
            pnpm test:native hermes deepseek pi --cancel --image-only &&
            pnpm test:native --stdio --image-only; } 2>&1 | tee /tmp/reconciled-native/execution.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: worker-reconciliation-native-acceptance
          path: |
            /tmp/reconciled-native/
            coverage/native/
          retention-days: 7
