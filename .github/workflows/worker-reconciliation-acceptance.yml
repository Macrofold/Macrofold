name: Worker reconciliation acceptance
on:
  push:
    branches: [integration/worker-reconciliation-checks]
    paths: [.github/workflows/worker-reconciliation-acceptance.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  domain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLATFORM_MODE: local
      EXECUTION_PROVIDER: simulator
      ALLOW_PAID_EXECUTION: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup
      - name: Finish the existing Worker fixture's queued cancellation through its real owner
        run: |
          mkdir -p /tmp/reconciliation-acceptance
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          p=Path('tests/integration/workers.test.ts');s=p.read_text()
          before="import { admitRun, getNativeRun } from '../../packages/core/src/runs';"
          after="import { admitRun, cancelRun, getNativeRun } from '../../packages/core/src/runs';"
          if s.count(before)!=1:raise RuntimeError('Unexpected Worker import')
          s=s.replace(before,after)
          before='  await tx(t=>t.query("UPDATE runs SET cancel_requested=true WHERE config ? \'worker_id\' AND status=\'queued\'").then(()=>{}));'
          after='''  // Retire our synthetic queue entries, not merely request cancellation.
            // Global candidate discovery intentionally prioritizes pending cleanup.
            const queued=await tx(t=>t.query<{id:string}>("SELECT id FROM runs WHERE config ? 'worker_id' AND status='queued'"));
            for(const run of queued.rows)await tx(t=>cancelRun(t,principal,run.id));'''
          if s.count(before)!=1:raise RuntimeError('Unexpected Worker cleanup')
          s=s.replace(before,after);p.write_text(s)
          shutil.copyfile(p,'/tmp/reconciliation-acceptance/workers.test.ts')
          data=p.read_bytes();Path('/tmp/reconciliation-acceptance/fixture-hash.json').write_text(json.dumps({'path':str(p),'sha':hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()}))
          p=Path('tests/integration/scheduling.test.ts');s=p.read_text()
          before="    expect(await claimRun(head.organization_id, head.resource_id)).not.toBeNull();"
          after="""    const claimed=await claimRun(head.organization_id,head.resource_id);
              if(!claimed) {
                const detail=await transaction(head.organization_id,async tx=>({
                  row:(await presentRuns(tx,[await getRun(tx,head.resource_id)]))[0],
                  turn:await(await import('../../packages/core/src/scheduling')).schedulerTurn(tx),
                }));
                console.info('SCHEDULER_DIAGNOSTIC',JSON.stringify({head,tenant:!!tenants.find(a=>a.p.organizationId===head.organization_id),
                  status:detail.row.status,reason:detail.row.waiting_reason,code:detail.row.failure_code,turn:detail.turn}));
              }
              expect(claimed).not.toBeNull();"""
          if s.count(before)!=2:raise RuntimeError('Unexpected scheduler assertions')
          p.write_text(s.replace(before,after))
          PY
      - name: Execute the complete existing domain suite
        run: pnpm test:domain 2>&1 | tee /tmp/reconciliation-acceptance/domain.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: worker-reconciliation-acceptance
          path: /tmp/reconciliation-acceptance/
          retention-days: 7
      - name: Clean disposable infrastructure
        if: always()
        run: docker compose -f infra/compose.yml down -v
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PLATFORM_MODE: local
      EXECUTION_PROVIDER: simulator
      ALLOW_PAID_EXECUTION: 'false'
      NATIVE_COVERAGE_DIR: coverage/native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Execute image-based native acceptance with source-complete coverage
        run: |
          mkdir -p /tmp/reconciled-native
          docker build -f infra/runtime.Dockerfile -t platform-runtime:0.1.0 . > /tmp/reconciled-native/build.log 2>&1 || { tail -100 /tmp/reconciled-native/build.log; exit 1; }
          for args in '--image-only' 'codex claude-code --media --image-only' '--permissions --image-only' 'opencode --questions --image-only' 'hermes deepseek pi --tools --image-only' 'hermes deepseek pi --failure --image-only' 'hermes deepseek pi --cancel --image-only' '--stdio --image-only'; do
            pnpm test:native $args 2>&1 | tee -a /tmp/reconciled-native/execution.log
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: worker-reconciliation-native-acceptance
          path: |
            /tmp/reconciled-native/
            coverage/native/
          retention-days: 7
