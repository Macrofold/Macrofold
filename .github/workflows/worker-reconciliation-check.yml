name: Worker reconciliation checks
on:
  push:
    branches: [integration/worker-reconciliation-checks]
    paths:
      - .github/workflows/worker-reconciliation-check.yml
      - scripts/sdk/python.ts
      - scripts/test-native.ts
permissions:
  contents: read
jobs:
  sdks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLATFORM_MODE: local
      EXECUTION_PROVIDER: simulator
      ALLOW_PAID_EXECUTION: 'false'
      RUSTUP_TOOLCHAIN: '1.94.1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache-dependency-path: sdk/go/go.sum
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Generate current contracts and preserve exact emitted changes
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          files={}
          for directory in ('sdk','packages/contracts'):
              for p in pathlib.Path(directory).rglob('*'):
                  if p.is_file() and 'node_modules' not in p.parts:
                      files[str(p)]=hashlib.sha256(p.read_bytes()).hexdigest()
          pathlib.Path('/tmp/before-generation.json').write_text(json.dumps(files))
          PY
          pnpm sdk:generate:all
          python3 - <<'PY'
          import hashlib,json,pathlib,shutil
          before=json.loads(pathlib.Path('/tmp/before-generation.json').read_text())
          out=pathlib.Path('/tmp/reconciled-sdk');out.mkdir()
          changed={}
          for directory in ('sdk','packages/contracts'):
              for p in pathlib.Path(directory).rglob('*'):
                  if not p.is_file() or 'node_modules' in p.parts: continue
                  data=p.read_bytes()
                  if hashlib.sha256(data).hexdigest()==before.get(str(p)): continue
                  dest=out/p;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,dest)
                  changed[str(p)]=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          (out/'manifest.json').write_text(json.dumps(changed,indent=2))
          print(json.dumps(changed,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reconciled-sdk-output
          path: /tmp/reconciled-sdk/
          retention-days: 7
      - run: python -m pip install './sdk/python[test]'
      - run: rustup toolchain install 1.94.1 --profile minimal
      - run: pnpm run setup
      - run: pnpm test:sdks
      - name: Clean disposable infrastructure
        if: always()
        run: docker compose -f infra/compose.yml down -v
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PLATFORM_MODE: local
      EXECUTION_PROVIDER: simulator
      ALLOW_PAID_EXECUTION: 'false'
      NATIVE_COVERAGE_DIR: coverage/native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Build and execute existing native image journeys
        run: |
          docker build -f infra/runtime.Dockerfile -t platform-runtime:0.1.0 . > /tmp/worker-native-build.log 2>&1 || { tail -100 /tmp/worker-native-build.log; exit 1; }
          pnpm test:native --image-only
          pnpm test:native codex claude-code --media --image-only
          pnpm test:native --permissions --image-only
          pnpm test:native opencode --questions --image-only
          pnpm test:native hermes deepseek pi --tools --image-only
          pnpm test:native hermes deepseek pi --failure --image-only
          pnpm test:native hermes deepseek pi --cancel --image-only
          pnpm test:native --stdio --image-only
      - name: Retain coverage and image evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reconciled-native-evidence
          path: |
            coverage/native/
            /tmp/worker-native-build.log
          retention-days: 7
