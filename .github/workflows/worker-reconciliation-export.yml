name: Worker reconciliation source audit
on:
  push:
    branches: [integration/worker-reconciliation-checks]
    paths: [.github/workflows/worker-reconciliation-export.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 19865a2f45885e228deb6b7ea443e33982257d21
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3337c16e6c82569ddfebce1e1eddffce2731bfb4
          path: worker
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ea0c17cecae715f4def2c17d4cbe4e32d1ae8ae9
          path: main
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 361da50482558a3547470c75320a0651dffddd1f
          path: candidate
          persist-credentials: false
      - name: Export source text and byte-accurate manifests
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tarfile
          out = pathlib.Path('/tmp/reconciliation-source')
          out.mkdir()
          all_manifests = {}
          with tarfile.open(out / 'sources.tar.gz', 'w:gz') as archive:
              for name in ('baseline', 'worker', 'main', 'candidate'):
                  root = pathlib.Path(name)
                  manifest = {}
                  for current, dirs, files in os.walk(root, followlinks=False):
                      dirs[:] = sorted(d for d in dirs if d not in {'.git', 'node_modules'})
                      for filename in sorted(files):
                          p = pathlib.Path(current) / filename
                          relative = p.relative_to(root).as_posix()
                          data = os.readlink(p).encode() if p.is_symlink() else p.read_bytes()
                          digest = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                          manifest[relative] = {'sha': digest, 'mode': '120000' if p.is_symlink() else '100755' if p.stat().st_mode & 0o111 else '100644'}
                          if len(data) <= 2000000 and not p.is_symlink():
                              try: data.decode('utf-8')
                              except UnicodeDecodeError: continue
                              archive.add(p, arcname=f'{name}/{relative}', recursive=False)
                  all_manifests[name] = manifest
          (out / 'manifests.json').write_text(json.dumps(all_manifests, sort_keys=True))
          print(json.dumps({name:len(manifest) for name,manifest in all_manifests.items()}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-reconciliation-sources
          path: /tmp/reconciliation-source/
          retention-days: 7
