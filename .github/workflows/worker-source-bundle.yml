name: Worker source bundle
on:
  push:
    branches: [feat/worker-compute-platform]
    paths: [.github/workflows/worker-source-bundle.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'Macrofold/Macrofold'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLATFORM_MODE: local
      EXECUTION_PROVIDER: simulator
      ALLOW_PAID_EXECUTION: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Prepare offline dependency and toolchain bundle
        run: |
          mkdir -p .tools
          cp "$(command -v node)" .tools/node
          PNPMPATH="$(find "$HOME/.cache/node/corepack" -path '*/10.33.0/bin/pnpm.cjs' -print -quit)"
          test -n "$PNPMPATH"
          cp -a "$(dirname "$(dirname "$PNPMPATH")")" .tools/pnpm
          find apps packages sdk -type d -name node_modules -prune -print0 > /tmp/dependency-dirs
          printf 'node_modules\0.tools\0' >> /tmp/dependency-dirs
          tar --null -T /tmp/dependency-dirs -czf /tmp/macrofold-dependencies.tar.gz
          split -b 350m -d /tmp/macrofold-dependencies.tar.gz /tmp/deps-part-
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-offline-dependencies-0
          path: /tmp/deps-part-00
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-offline-dependencies-1
          path: /tmp/deps-part-01
          retention-days: 1
          if-no-files-found: error
