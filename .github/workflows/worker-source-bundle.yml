name: Worker test tooling
on:
  push:
    branches: [feat/worker-compute-platform]
    paths: [.github/workflows/worker-source-bundle.yml]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Export PostgreSQL tooling without data or credentials
        run: |
          mkdir -p /tmp/pg-tools
          docker run --rm -v /tmp/pg-tools:/bundle postgres:17-bookworm bash -ec '
            mkdir -p /bundle/root
            cp -a --parents /usr/lib/postgresql/17 /usr/share/postgresql/17 /bundle/root
            ldd /usr/lib/postgresql/17/bin/* /usr/lib/postgresql/17/lib/*.so 2>/dev/null | awk "/=> \\// {print \$3}" | sort -u | xargs -r cp -L --parents -t /bundle/root
            tar -C /bundle/root -czf /bundle/pg-tools.tar.gz .
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-postgres-tools
          path: /tmp/pg-tools/pg-tools.tar.gz
          retention-days: 1
          if-no-files-found: error
