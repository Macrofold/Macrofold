name: Worker test tool export
on:
  push:
    branches: [feat/worker-economics-autoscaling]
    paths: [.github/workflows/worker-test-tools.yml]
permissions:
  contents: read
jobs:
  tools:
    if: github.repository == 'Macrofold/Macrofold'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - name: Export public PostgreSQL image without any running database or credentials
        run: |
          mkdir -p /tmp/test-tools
          docker pull postgres:17-bookworm
          container=$(docker create postgres:17-bookworm)
          docker export "$container" | gzip -1 > /tmp/test-tools/postgres-rootfs.tar.gz
          docker rm "$container"
          tar -C "$HOME/.cache/node/corepack" -czf /tmp/test-tools/pnpm.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-test-tools
          path: /tmp/test-tools/
          compression-level: 0
          retention-days: 1
