name: Worker offline toolchain
on:
  push:
    branches: [feat/worker-economics-autoscaling]
    paths: [.github/workflows/worker-toolchain.yml]
permissions:
  contents: read
jobs:
  dependencies:
    if: github.repository == 'Macrofold/Macrofold' && github.ref == 'refs/heads/feat/worker-economics-autoscaling'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Export only installed packages and public runtime binary
        run: |
          mkdir -p /tmp/worker-toolchain
          find . -name node_modules -type d -prune -print0 | tar --null -T - -czf /tmp/worker-toolchain/dependencies.tar.gz
          cp "$(command -v node)" /tmp/worker-toolchain/node
          split -b 300m /tmp/worker-toolchain/dependencies.tar.gz /tmp/worker-toolchain/packages-
          git rev-parse HEAD > /tmp/worker-toolchain/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-packages-a
          path: /tmp/worker-toolchain/packages-aa
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-packages-b
          path: /tmp/worker-toolchain/packages-ab
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-node
          path: |
            /tmp/worker-toolchain/node
            /tmp/worker-toolchain/commit.txt
          retention-days: 1
