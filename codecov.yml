coverage:
  precision: 2
  round: down
  status:
    project:
      default:
        target: auto
        threshold: 0.1%
    patch:
      default:
        target: 80%
        # Supplemental coverage uses conservative exact source-location matching.
        # Keep patch reporting informational while this baseline is adopted.
        informational: true
comment:
  layout: reach,diff,flags,files
  behavior: default
  require_changes: true
flags:
  typescript:
    carryforward: false
  python:
    carryforward: false
