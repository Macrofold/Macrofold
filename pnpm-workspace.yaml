packages:
  - apps/*
  - packages/*
  - sdk/typescript
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - opencode-ai
overrides:
  # Stryker's HTTP client pins a qs release with known denial-of-service findings.
  'typed-rest-client>qs': 6.16.0
  # Keep the application/runtime HTTP and MCP graphs on patched, compatible lines.
  'undici@>=7 <7.30.1': 7.30.1
  'undici@>=8 <8.12.2': 8.12.2
  '@modelcontextprotocol/sdk@>=1 <1.32.0': 1.32.0
  'body-parser@2.3.0': 2.4.0
  'brace-expansion@2.1.4': 2.1.6
  'brace-expansion@5.0.9': 5.0.11
  'compression@1.8.1': 1.8.2
  'proxy-addr@2.0.7': 2.0.8
  'sharp@0.35.4': 0.35.5
  'zod@>=4 <4.6.6': 4.6.6
  'nanoid@5.1.6': 5.1.16
  # Patch transitive parser DoS findings without changing harness/workflow APIs.
  'js-yaml@4.3.1': 4.3.2
  'devalue@5.8.1': 5.9.2
