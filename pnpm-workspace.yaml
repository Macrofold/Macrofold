packages:
  - apps/*
  - packages/*
  - sdk/typescript
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - opencode-ai
overrides:
  # Stryker's HTTP client pins a qs release with known denial-of-service findings.
  'typed-rest-client>qs': 6.16.1
  'undici@>=7 <7.30.1': 7.30.1
  'undici@>=8 <8.12.2': 8.12.2
  'nanoid@5.1.6': 5.1.16
  # Patch transitive parser DoS findings without changing harness/workflow APIs.
  'js-yaml@4.3.1': 4.3.2
  'devalue@>=5 <5.9.3': 5.9.3
  # Vercel CLI and harnesses pin older Zod 4 releases; retain its major API.
  'zod@>=4 <4.6.6': 4.6.6
  # Vitest's optional Vite peer must resolve beyond the fixed dev-server range.
  'vite@>=8 <8.2.4': 8.2.4
