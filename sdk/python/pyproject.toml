[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hosted-agents"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "Hosted agent API client with durable event streaming"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1"]

[tool.setuptools.package-data]
hosted_agents = ["routes.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
