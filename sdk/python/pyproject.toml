[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "macrofold"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "Hosted agent API client with durable event streaming"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.11,<3", "typing-extensions>=4.7.1,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pyright==1.1.411"]

[tool.setuptools.package-data]
macrofold = ["routes.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["macrofold", "macrofold.models"]
